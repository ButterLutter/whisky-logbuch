<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1410">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Whisky-Logbuch">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Whisky-Logbuch</title>
<style>
:root{
  --bg:#1b1410; --card:#2a201a; --card2:#34281f; --line:#4a3a2d;
  --text:#f3e9dc; --muted:#a8957f; --amber:#e0a030; --amber2:#b9791c;
  --bonus:#e2573b; --danger:#d9534f; --ok:#6aa84f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
body{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
h1{margin:0 0 10px;font-size:22px;letter-spacing:.3px}
h1 span{color:var(--amber)}
h3{margin:0}
.row{display:flex;gap:8px;align-items:center}
input,select,textarea{width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--amber)}
textarea{min-height:64px;resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 5px}
button{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
button.primary{background:var(--amber);color:#2a1a05;border-color:var(--amber);font-weight:700}
button.danger{color:var(--danger);border-color:var(--danger);background:transparent}
button.ghost{background:transparent}
main{padding:12px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:12px}
.card:active{background:var(--card2)}
.card h3{margin:0 0 2px;font-size:17px}
.sub{color:var(--muted);font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:12px;background:var(--card2);border:1px solid var(--line);color:var(--text);padding:2px 8px;border-radius:999px}
.empty{text-align:center;color:var(--muted);padding:60px 20px;line-height:1.6}
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;font-size:32px;line-height:1;padding:0;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* Sterne */
.stars{display:inline-flex;align-items:center;gap:2px;vertical-align:middle}
.st{position:relative;display:inline-block;width:var(--s,18px);height:var(--s,18px)}
.st svg{width:var(--s,18px);height:var(--s,18px);display:block}
.st .bg path{fill:#4a3d31}
.st .fill{position:absolute;left:0;top:0;height:100%;overflow:hidden}
.st .fill svg{width:var(--s,18px)}
.st .fill path{fill:var(--amber)}
.st.bonus .bg path{fill:#4a3d31}
.st.bonus.on .bg path{fill:var(--bonus)}
.rate{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rate .stars{--s:38px;gap:4px;touch-action:none}
.bonusbtn{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px}
.bonusbtn.on{border-color:var(--bonus);background:rgba(226,87,59,.15)}
.rv{font-weight:700;color:var(--amber);min-width:44px}
.cardtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rating{white-space:nowrap;text-align:right}
.rating .num{font-size:13px;color:var(--amber);font-weight:700;display:block;margin-top:2px}
.rating .num.b{color:var(--bonus)}
/* Noten-Chips */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.chip{border-radius:999px;padding:7px 12px;font-size:14px;background:var(--card)}
.chip.on{background:var(--amber);color:#2a1a05;border-color:var(--amber);font-weight:600}
.chip .em{margin-right:5px}
.chip.add{color:var(--amber);border-style:dashed;padding:7px 14px}
.sel{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sel .chip{padding:5px 10px;font-size:13px}
.hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4}
/* Reiter */
.tabs{display:flex;gap:6px;margin-top:16px}
.tab{flex:1;min-width:0;padding:10px 2px;border-radius:10px 10px 0 0;font-weight:600;font-size:14px;white-space:nowrap;text-align:center}
.tab.on{background:var(--amber);color:#2a1a05;border-color:var(--amber)}
.tab i{font-style:normal;font-size:11px;background:rgba(0,0,0,.28);color:var(--text);border-radius:999px;padding:1px 6px;margin-left:3px}
.tab.on i{background:rgba(0,0,0,.18);color:#2a1a05}
.tabpanel{border:1px solid var(--line);border-top:2px solid var(--amber);border-radius:0 0 12px 12px;padding:2px 12px 12px;margin-top:-1px;background:rgba(255,255,255,.015)}
.ghead{width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:10px;padding:9px 12px;margin-top:8px;text-align:left}
.ghead i{font-style:normal;background:var(--amber);color:#2a1a05;border-radius:999px;padding:0 7px;font-size:12px;font-weight:700;margin-left:6px}
.arr{color:var(--muted)}
.addrow{display:flex;gap:6px;margin-top:8px;align-items:center}
.addrow .ae{width:68px;flex:none;text-align:center}
.addrow button{flex:none;padding:10px 12px}
/* Liste: Noten-Symbole */
.nrows{margin-top:8px}
.nrow{display:grid;grid-template-columns:74px 1fr;align-items:start;gap:6px;margin-top:4px}
.nrow small{color:var(--muted);font-size:12px;padding-top:3px}
.ni{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.ic{font-size:18px;line-height:1.2}
.ic.tx{font-size:11px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--text)}
.more{font-size:12px;color:var(--muted)}
.view{display:none}.view.active{display:block}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:6}
.bar button{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));background:#000d;color:#fff;padding:10px 16px;border-radius:999px;z-index:40;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.detail h2{margin:0}
.dl{margin-top:16px}
.dl b{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.dl p{margin:0;white-space:pre-wrap;line-height:1.5}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:14px}
.meta div{font-size:14px}.meta small{display:block;color:var(--muted);font-size:12px}
/* Menü-Sheet */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:flex;align-items:flex-end}
.sheetbox{width:100%;background:var(--card);border-radius:18px 18px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.sheetbox button{padding:14px}
/* Verwaltung */
.mgroup{margin-top:18px}
.mgroup>b{display:block;color:var(--amber);font-size:13px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.mrow.dim .mn{opacity:.45;text-decoration:line-through}
.mrow button{padding:6px 10px;font-size:14px;flex:none}
.mrow select{width:auto;padding:6px 8px;font-size:14px;flex:none;max-width:42vw}
.mn{flex:1;min-width:0;overflow-wrap:anywhere}
</style>
</head>
<body>

<!-- LISTE -->
<div id="vList" class="view active">
  <header>
    <h1>🥃 Whisky<span>-Logbuch</span></h1>
    <div class="row"><input id="q" type="search" placeholder="Suchen (Name, Destillerie, Note …)"></div>
    <div class="row" style="margin-top:8px">
      <select id="sort">
        <option value="date">Neueste Verkostung zuerst</option>
        <option value="rating">Beste Bewertung zuerst</option>
        <option value="name">Name A–Z</option>
        <option value="year">Jahrgang</option>
      </select>
      <button id="btnMenu" class="ghost" aria-label="Menü">⋯</button>
    </div>
  </header>
  <main id="list"></main>
  <button class="fab primary" id="btnNew" aria-label="Neuer Eintrag">+</button>
</div>

<!-- DETAIL -->
<div id="vDetail" class="view">
  <header><div class="row"><button class="ghost" id="dBack">← Zurück</button></div></header>
  <main id="detail" class="detail"></main>
  <div class="bar"><button class="danger" id="dDel">Löschen</button><button class="primary" id="dEdit">Bearbeiten</button></div>
</div>

<!-- FORMULAR -->
<div id="vForm" class="view">
  <header><div class="row"><button class="ghost" id="fBack">← Abbrechen</button><b id="fTitle" style="margin-left:auto">Neuer Eintrag</b></div></header>
  <main>
    <label for="f_name">Name des Whiskys *</label>
    <input id="f_name" placeholder="z. B. Lagavulin 16" autocomplete="off">

    <label for="f_dist">Destillerie / Marke</label>
    <input id="f_dist" autocomplete="off">

    <label for="f_region">Region / Land</label>
    <select id="f_region"></select>
    <div class="addrow" id="newRegionRow" hidden>
      <input id="f_newRegion" placeholder="Eigene Region …" autocomplete="off">
      <button type="button" id="addRegion">Hinzufügen</button>
    </div>

    <div class="grid2">
      <div><label for="f_type">Art</label>
        <select id="f_type">
          <option value="">–</option><option>Single Malt</option><option>Blended Malt</option><option>Blend</option>
          <option>Bourbon</option><option>Rye</option><option>Irish</option><option>Japanese</option><option>Sonstiges</option>
        </select></div>
      <div><label for="f_abv">Alkohol (% vol.)</label><input id="f_abv" inputmode="decimal" placeholder="43"></div>
    </div>
    <div class="grid2">
      <div><label for="f_year">Jahrgang</label><input id="f_year" inputmode="numeric" placeholder="z. B. 2008"></div>
      <div><label for="f_age">Alter (Jahre)</label><input id="f_age" inputmode="numeric" placeholder="z. B. 12"></div>
    </div>
    <div class="grid2">
      <div><label for="f_date">Datum der Verkostung</label><input id="f_date" type="date"></div>
      <div><label for="f_place">Ort / Anlass</label><input id="f_place" placeholder="Whisky-Abend, Bar…" autocomplete="off"></div>
    </div>

    <label>Bewertung</label>
    <div class="rate">
      <div class="stars" id="starPick"></div>
      <span class="rv" id="rv">–</span>
      <button type="button" class="bonusbtn" id="bonusBtn">
        <span class="stars" style="--s:22px"><span class="st bonus" id="bonusStar"></span></span> Bonus
      </button>
      <button type="button" class="ghost" id="rateClear">Zurücksetzen</button>
    </div>
    <div class="hint">Tippe links bzw. rechts in einen Stern für halbe bzw. ganze Punkte. Der rote Bonus-Stern hebt etwas Besonderes hervor.</div>

    <div class="tabs" id="tabs">
      <button type="button" class="tab on" id="tab_nose" data-t="nose">Nase</button>
      <button type="button" class="tab" id="tab_taste" data-t="taste">Geschmack</button>
      <button type="button" class="tab" id="tab_finish" data-t="finish">Abgang</button>
    </div>

    <div class="tabpanel" data-t="nose">
      <div class="notesbox" id="notes_nose"></div>
      <label for="f_nose">Notizen zur Nase</label>
      <textarea id="f_nose"></textarea>
    </div>
    <div class="tabpanel" data-t="taste" hidden>
      <div class="notesbox" id="notes_taste"></div>
      <label for="f_taste">Notizen zum Geschmack</label>
      <textarea id="f_taste"></textarea>
    </div>
    <div class="tabpanel" data-t="finish" hidden>
      <div class="notesbox" id="notes_finish"></div>
      <label for="f_finish">Notizen zum Abgang</label>
      <textarea id="f_finish"></textarea>
    </div>

    <label for="f_notes">Gesamteindruck / eigene Notizen</label>
    <textarea id="f_notes" placeholder="Würde ich nachkaufen?, Preis …"></textarea>
  </main>
  <div class="bar"><button class="primary" id="fSave">Speichern</button></div>
</div>

<!-- VERWALTUNG -->
<div id="vManage" class="view">
  <header><div class="row"><button class="ghost" id="mBack">← Zurück</button><b style="margin-left:auto">Noten &amp; Regionen</b></div></header>
  <main id="manage"></main>
</div>

<!-- MENÜ -->
<div class="sheet" id="sheet" hidden>
  <div class="sheetbox">
    <button id="mManage">Noten &amp; Regionen verwalten</button>
    <button id="mExport">Backup exportieren</button>
    <button id="mImport">Backup importieren</button>
    <button id="mClose" class="ghost">Schließen</button>
  </div>
</div>

<input type="file" id="importFile" accept="application/json,.json" hidden>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

const KEY  = 'whisky-logbuch-v1';
const SKEY = 'whisky-logbuch-settings-v1';

/* ---------- Mitgelieferte Noten (gemeinsame Liste für Nase, Geschmack, Abgang) ---------- */
const GROUPS = ['Süß','Fruchtig','Würzig','Holz & Röst','Rauch & Torf','Meer & Küste','Sonstiges'];
const BASE = {
  'Süß':          [['Vanille','🍦'],['Karamell','🍮'],['Honig','🍯'],['Toffee','🍬'],['Schokolade','🍫']],
  'Fruchtig':     [['Apfel','🍎'],['Birne','🍐'],['Zitrus','🍋'],['Trockenfrüchte',''],['Rosinen','🍇'],['Kirsche','🍒'],['Tropisch','🍍']],
  'Würzig':       [['Pfeffer',''],['Zimt',''],['Nelke',''],['Ingwer',''],['Muskat','']],
  'Holz & Röst':  [['Eiche','🌳'],['Nuss','🥜'],['Kaffee','☕'],['Tabak',''],['Leder',''],['Toast','🍞']],
  'Rauch & Torf': [['Rauch','💨'],['Torf',''],['Lagerfeuer','🔥'],['Holzkohle',''],['Asche','🌫️'],['Speck','🥓'],['Räucherschinken','🍖'],['Räucherfisch','🐟'],['Teer',''],['Grill/BBQ','🍗'],['Kaminfeuer',''],['Medizinisch','🩹']],
  'Meer & Küste': [['Salzig','🧂'],['Jod',''],['Seetang',''],['Meeresbrise','🌊'],['Austernschale','🦪']],
  'Sonstiges':    [['Malz',''],['Getreide','🌾'],['Blumig','🌸'],['Kräuter','🌿'],['Sherry','🍷'],['Ölig','💧'],['Scharf','']]
};
const TABS = [
  {k:'nose',   label:'Nase',      txt:'nose',   notes:'noseNotes'},
  {k:'taste',  label:'Geschmack', txt:'taste',  notes:'tasteNotes'},
  {k:'finish', label:'Abgang',    txt:'finish', notes:'finishNotes'}
];

/* ---------- Regionen ---------- */
const REG_SCOT = [['Speyside','Speyside'],['Highlands','Highlands'],['Lowlands','Lowlands'],['Islay','Islay'],['Campbeltown','Campbeltown'],['Schottische Inseln','Inseln (Skye, Jura, Mull, Orkney …)']];
const REG_OTHER = ['Irland','USA – Kentucky','USA – Tennessee','USA – Sonstige','Kanada','Japan','Taiwan','Indien','Frankreich','Deutschland','Österreich','Schweiz','Schweden','Australien'].map(x=>[x,x]);
const KNOWN_REGIONS = new Set([...REG_SCOT,...REG_OTHER].map(r=>r[0]));

const $ = id => document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(v){ return String(v).replace('.',','); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(s){ if(!s) return ''; const p=s.split('-'); return p.length===3?`${p[2]}.${p[1]}.${p[0]}`:s; }
function short(n){ return n.length>9 ? n.slice(0,8)+'.' : n; }
let tt; function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2600); }

/* ---------- Speicher ---------- */
function loadSettings(){
  let s=null; try{ s=JSON.parse(localStorage.getItem(SKEY)); }catch(e){}
  s = s && typeof s==='object' ? s : {};
  return {
    hidden:  Array.isArray(s.hidden)  ? s.hidden.filter(x=>typeof x==='string') : [],
    custom:  Array.isArray(s.custom)  ? s.custom.filter(c=>c && typeof c.name==='string' && c.name) : [],
    regions: Array.isArray(s.regions) ? s.regions.filter(x=>typeof x==='string' && x) : []
  };
}
function saveSettings(){ try{ localStorage.setItem(SKEY, JSON.stringify(S)); return true; }catch(e){ toast('Speichern fehlgeschlagen!'); return false; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(entries)); return true; }catch(e){ toast('Speichern fehlgeschlagen!'); return false; } }
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}

/* Alte Einträge ins neue Format übernehmen: Gaumen -> Geschmack, Geschmacks-Auswahl -> Geschmacksnoten */
function normalizeEntry(e){
  let ch=false;
  if(e.palate!==undefined){
    if(e.palate) e.taste = e.taste ? e.taste+'\n'+e.palate : e.palate;
    delete e.palate; ch=true;
  }
  if(e.flavors!==undefined){
    if(!Array.isArray(e.tasteNotes)) e.tasteNotes=[];
    (Array.isArray(e.flavors)?e.flavors:[]).forEach(f=>{ if(!e.tasteNotes.includes(f)) e.tasteNotes.push(f); });
    delete e.flavors; ch=true;
  }
  TABS.forEach(t=>{ if(!Array.isArray(e[t.notes])) e[t.notes]=[]; else e[t.notes]=e[t.notes].filter(x=>typeof x==='string'); });
  return ch;
}
function load(){
  let raw=null; try{ raw=localStorage.getItem(KEY); }catch(e){}
  let d=[]; try{ const p=JSON.parse(raw); if(Array.isArray(p)) d=p.filter(x=>x&&typeof x==='object'); }catch(e){}
  const needs=d.some(e=>e.palate!==undefined||e.flavors!==undefined);
  if(needs && raw){ try{ if(!localStorage.getItem(KEY+'-backup-vor-update')) localStorage.setItem(KEY+'-backup-vor-update',raw); }catch(e){} }
  let ch=false; d.forEach(e=>{ if(normalizeEntry(e)) ch=true; });
  return {d,ch};
}

let S = loadSettings();
const L0 = load();
let entries = L0.d;
let cur = null, detailId = null, curTab = 'nose';
let openG = {nose:new Set(),taste:new Set(),finish:new Set()};
let addOpen = null;

/* ---------- Noten-Katalog ---------- */
function noteMap(){
  const m=new Map();
  GROUPS.forEach(g=>BASE[g].forEach(([n,e])=>m.set(n,{name:n,emoji:e,group:g,builtin:true,hidden:S.hidden.includes(n)})));
  S.custom.forEach(c=>{ if(!m.has(c.name)) m.set(c.name,{name:c.name,emoji:c.emoji||'',group:GROUPS.includes(c.group)?c.group:'Sonstiges',builtin:false,hidden:false}); });
  return m;
}
function ensureNotesKnown(){
  const map=noteMap(); let ch=false;
  entries.forEach(e=>TABS.forEach(t=>(e[t.notes]||[]).forEach(n=>{
    if(!map.has(n)){ S.custom.push({name:n,emoji:'',group:'Sonstiges'}); map.set(n,{}); ch=true; }
  })));
  if(ch) saveSettings();
  return ch;
}
if(ensureNotesKnown() || L0.ch) save();

function firstGlyph(s){
  s=(s||'').trim(); if(!s) return '';
  let g='';
  try{
    if(window.Intl && Intl.Segmenter){ const it=new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(s)[Symbol.iterator]().next(); g=it.value?it.value.segment:''; }
    else g=Array.from(s)[0]||'';
  }catch(e){ g=Array.from(s)[0]||''; }
  try{ if(!/\p{Extended_Pictographic}/u.test(g)) return ''; }catch(e){}
  return g;
}

function show(v){
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  $(v).classList.add('active'); window.scrollTo(0,0);
}

/* ---------- Sterne ---------- */
const STAR = '<svg viewBox="0 0 24 24"><path d="M12 2l3.1 6.6 7 .7-5.3 4.7 1.4 7-6.2-3.6-6.2 3.6 1.4-7L1.9 9.3l7-.7z"/></svg>';
function starsHTML(val, size){
  let h=`<span class="stars" style="--s:${size}px">`;
  for(let i=0;i<5;i++){
    const w=Math.max(0,Math.min(1,val-i))*100;
    h+=`<span class="st"><span class="bg">${STAR}</span><span class="fill" style="width:${w}%">${STAR}</span></span>`;
  }
  return h+'</span>';
}
function bonusStarHTML(size,on){
  return `<span class="stars" style="--s:${size}px"><span class="st bonus ${on?'on':''}"><span class="bg">${STAR}</span></span></span>`;
}
function ratingHTML(e, size){
  const has = e.rating>0;
  let h = starsHTML(e.rating||0,size);
  if(e.bonus) h += ' '+bonusStarHTML(size,true);
  const txt = has ? fmt(e.rating)+' / 5' : (e.bonus?'':'unbewertet');
  return `<span class="rating">${h}<span class="num ${e.bonus?'b':''}">${txt}${e.bonus?(has?' + Bonus':'Bonus'):''}</span></span>`;
}
function buildStarPicker(){
  const box=$('starPick'); box.innerHTML='';
  for(let i=0;i<5;i++){
    const s=document.createElement('span'); s.className='st'; s.dataset.i=i;
    s.innerHTML=`<span class="bg">${STAR}</span><span class="fill" style="width:0%">${STAR}</span>`;
    box.appendChild(s);
  }
  box.onclick=ev=>{
    const st=ev.target.closest('.st'); if(!st) return;
    const r=st.getBoundingClientRect();
    const i=+st.dataset.i;
    const v = (ev.clientX - r.left) < r.width/2 ? i+0.5 : i+1;
    cur.rating = (cur.rating===v) ? 0 : v;
    paintPicker();
  };
}
function paintPicker(){
  document.querySelectorAll('#starPick .st').forEach(st=>{
    const i=+st.dataset.i; st.querySelector('.fill').style.width=Math.max(0,Math.min(1,cur.rating-i))*100+'%';
  });
  $('rv').textContent = cur.rating>0 ? fmt(cur.rating) : '–';
  $('bonusBtn').classList.toggle('on',!!cur.bonus);
  $('bonusStar').innerHTML=`<span class="bg">${STAR}</span>`;
  $('bonusStar').className='st bonus'+(cur.bonus?' on':'');
}

/* ---------- Noten im Formular (Reiter Nase / Geschmack / Abgang) ---------- */
function chipHTML(n,map,on){
  const d=map.get(n)||{emoji:''};
  return `<button type="button" class="chip ${on?'on':''}" data-n="${esc(n)}">${d.emoji?`<span class="em">${esc(d.emoji)}</span>`:''}${esc(n)}</button>`;
}
function renderNotes(t){
  const box=$('notes_'+t.k), sel=cur[t.notes], map=noteMap(), all=[...map.values()];
  let h='';
  if(sel.length) h+=`<div class="sel">${sel.map(n=>chipHTML(n,map,true)).join('')}</div>`;
  else h+=`<div class="hint">Gruppe antippen, um Noten auszuwählen.</div>`;
  GROUPS.forEach(g=>{
    const list=all.filter(n=>n.group===g && (!n.hidden || sel.includes(n.name)));
    const cnt=list.filter(n=>sel.includes(n.name)).length;
    const open=openG[t.k].has(g);
    h+=`<button type="button" class="ghead" data-g="${esc(g)}"><span>${esc(g)}${cnt?`<i>${cnt}</i>`:''}</span><span class="arr">${open?'▴':'▾'}</span></button>`;
    if(open){
      h+=`<div class="chips">${list.map(n=>chipHTML(n.name,map,sel.includes(n.name))).join('')}<button type="button" class="chip add" data-add="${esc(g)}" aria-label="Eigene Note hinzufügen">＋ Eigene</button></div>`;
      if(addOpen && addOpen.tab===t.k && addOpen.g===g){
        h+=`<div class="addrow"><input class="an" maxlength="30" placeholder="Neue Note …" autocomplete="off"><input class="ae" maxlength="8" placeholder="🙂" aria-label="Emoji (optional)" autocomplete="off"><button type="button" class="primary" data-ok="1">OK</button><button type="button" class="ghost" data-cancel="1">✕</button></div><div class="hint">Emoji ist optional. Ohne Emoji wird der Name als Text angezeigt.</div>`;
      }
    }
  });
  box.innerHTML=h;
}
function renderAllNotes(){ TABS.forEach(renderNotes); updateBadges(); }
function updateBadges(){
  TABS.forEach(t=>{ const n=cur[t.notes].length; $('tab_'+t.k).innerHTML=esc(t.label)+(n?` <i>${n}</i>`:''); });
}
function setTab(k){
  curTab=k;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===k));
  document.querySelectorAll('.tabpanel').forEach(p=>{ p.hidden = p.dataset.t!==k; });
}
$('tabs').addEventListener('click',ev=>{ const b=ev.target.closest('.tab'); if(b) setTab(b.dataset.t); });

function submitAdd(t){
  const box=$('notes_'+t.k);
  const name=(box.querySelector('.an')||{value:''}).value.trim().replace(/\s+/g,' ');
  const emoji=firstGlyph((box.querySelector('.ae')||{value:''}).value);
  if(!name){ toast('Bitte einen Namen eingeben'); return; }
  const g=addOpen?addOpen.g:'Sonstiges';
  const ex=[...noteMap().values()].find(n=>n.name.toLowerCase()===name.toLowerCase());
  let use=name;
  if(ex){
    use=ex.name;
    if(ex.hidden){ S.hidden=S.hidden.filter(x=>x!==ex.name); saveSettings(); }
    toast(`„${ex.name}" gibt es schon (${ex.group}) – ausgewählt`);
  } else {
    S.custom.push({name,emoji,group:g}); saveSettings();
  }
  if(!cur[t.notes].includes(use)) cur[t.notes].push(use);
  addOpen=null; renderAllNotes();
}
TABS.forEach(t=>{
  const box=$('notes_'+t.k);
  box.addEventListener('click',ev=>{
    const el=ev.target.closest('button'); if(!el) return;
    if(el.dataset.n!==undefined){
      const a=cur[t.notes], i=a.indexOf(el.dataset.n);
      if(i>=0) a.splice(i,1); else a.push(el.dataset.n);
      renderNotes(t); updateBadges();
    } else if(el.dataset.g!==undefined){
      const s=openG[t.k]; if(s.has(el.dataset.g)) s.delete(el.dataset.g); else s.add(el.dataset.g);
      if(addOpen && addOpen.tab===t.k && !s.has(addOpen.g)) addOpen=null;
      renderNotes(t);
    } else if(el.dataset.add!==undefined){
      const same=addOpen && addOpen.tab===t.k && addOpen.g===el.dataset.add;
      const prev=addOpen && addOpen.tab;
      addOpen = same ? null : {tab:t.k,g:el.dataset.add};
      if(prev && prev!==t.k) renderNotes(TABS.find(x=>x.k===prev));
      renderNotes(t);
      if(addOpen){ const i=box.querySelector('.an'); if(i) i.focus(); }
    } else if(el.dataset.ok!==undefined){ submitAdd(t); }
    else if(el.dataset.cancel!==undefined){ addOpen=null; renderNotes(t); }
  });
  box.addEventListener('keydown',ev=>{
    if(ev.key==='Enter' && ev.target.matches('.an,.ae')){ ev.preventDefault(); submitAdd(t); }
  });
});

/* ---------- Region ---------- */
function optGroup(label,items){
  return `<optgroup label="${esc(label)}">${items.map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join('')}</optgroup>`;
}
function buildRegionSelect(val){
  const sel=$('f_region');
  let h='<option value="">– nicht angegeben –</option>'+optGroup('Schottland',REG_SCOT)+optGroup('Weitere Länder',REG_OTHER);
  const customs=S.regions.filter(r=>!KNOWN_REGIONS.has(r));
  if(val && !KNOWN_REGIONS.has(val) && !customs.includes(val)) customs.push(val);
  if(customs.length) h+=optGroup('Eigene',customs.map(r=>[r,r]));
  h+='<option value="__new__">＋ Eigene Region hinzufügen …</option>';
  sel.innerHTML=h; sel.value=val||'';
  if(sel.value!==(val||'')) sel.value='';
}
$('f_region').addEventListener('change',()=>{
  const isNew=$('f_region').value==='__new__';
  $('newRegionRow').hidden=!isNew;
  if(isNew) $('f_newRegion').focus();
});
function addRegion(){
  const v=$('f_newRegion').value.trim().replace(/\s+/g,' ');
  if(!v){ toast('Bitte eine Region eingeben'); return; }
  if(!KNOWN_REGIONS.has(v) && !S.regions.includes(v)){ S.regions.push(v); saveSettings(); }
  $('f_newRegion').value=''; $('newRegionRow').hidden=true;
  buildRegionSelect(v);
}
$('addRegion').onclick=addRegion;
$('f_newRegion').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); addRegion(); }});

/* ---------- Liste ---------- */
function noteIcon(n,map){
  const d=map.get(n); const em=d&&d.emoji;
  return em ? `<span class="ic" title="${esc(n)}">${esc(em)}</span>` : `<span class="ic tx" title="${esc(n)}">${esc(short(n))}</span>`;
}
function noteRowsHTML(e){
  const map=noteMap(); let h='';
  TABS.forEach(t=>{
    const a=e[t.notes]||[]; if(!a.length) return;
    h+=`<div class="nrow"><small>${t.label}</small><span class="ni">${a.slice(0,6).map(n=>noteIcon(n,map)).join('')}${a.length>6?`<span class="more">+${a.length-6}</span>`:''}</span></div>`;
  });
  return h?`<div class="nrows">${h}</div>`:'';
}
function renderList(){
  const q=$('q').value.trim().toLowerCase(), sort=$('sort').value;
  let arr=entries.filter(e=>{
    if(!q) return true;
    return [e.name,e.distillery,e.region,e.type,e.year,e.place,e.nose,e.taste,e.finish,e.notes,
      ...TABS.map(t=>(e[t.notes]||[]).join(' '))].join(' ').toLowerCase().includes(q);
  });
  const score=e=>(e.rating||0)+(e.bonus?0.25:0);
  arr.sort((a,b)=>{
    if(sort==='rating') return score(b)-score(a) || (b.date||'').localeCompare(a.date||'');
    if(sort==='name') return (a.name||'').localeCompare(b.name||'','de');
    if(sort==='year') return (+b.year||0)-(+a.year||0);
    return (b.date||'').localeCompare(a.date||'') || (b.created||0)-(a.created||0);
  });
  const Lb=$('list');
  if(!arr.length){
    Lb.innerHTML = entries.length
      ? '<div class="empty">Nichts gefunden.</div>'
      : '<div class="empty">Noch keine Verkostungen.<br>Tippe auf <b>+</b>, um deinen ersten Whisky einzutragen. 🥃</div>';
    return;
  }
  Lb.innerHTML=arr.map(e=>{
    const meta=[e.distillery,e.region,e.year?('Jg. '+e.year):'',e.age?(e.age+' J.'):''].filter(Boolean).join(' · ');
    return `<div class="card" data-id="${esc(e.id)}">
      <div class="cardtop"><div><h3>${esc(e.name)}</h3><div class="sub">${esc(meta)||'&nbsp;'}</div></div>${ratingHTML(e,15)}</div>
      ${noteRowsHTML(e)}
      <div class="sub" style="margin-top:8px">${esc(fmtDate(e.date))}${e.place?' · '+esc(e.place):''}</div>
    </div>`;
  }).join('');
}
$('list').addEventListener('click',ev=>{ const c=ev.target.closest('.card'); if(c) openDetail(c.dataset.id); });
$('q').addEventListener('input',renderList);
$('sort').addEventListener('change',renderList);

/* ---------- Detail ---------- */
function openDetail(id){
  const e=entries.find(x=>x.id===id); if(!e) return;
  detailId=id;
  const map=noteMap();
  const meta=[['Destillerie',e.distillery],['Region / Land',e.region],['Art',e.type],['Jahrgang',e.year],['Alter',e.age?e.age+' Jahre':''],
    ['Alkohol',e.abv?fmt(e.abv)+' % vol.':''],['Verkostet am',fmtDate(e.date)],['Ort / Anlass',e.place]].filter(m=>m[1]);
  const tag=n=>{ const d=map.get(n); return `<span class="tag">${d&&d.emoji?esc(d.emoji)+' ':''}${esc(n)}</span>`; };
  const tabSec=TABS.map(t=>{
    const a=e[t.notes]||[], txt=e[t.txt];
    if(!a.length && !txt) return '';
    return `<div class="dl"><b>${t.label}</b>${a.length?`<div class="tags" style="margin-top:4px">${a.map(tag).join('')}</div>`:''}${txt?`<p style="margin-top:6px">${esc(txt)}</p>`:''}</div>`;
  }).join('');
  const sec=(t,v)=>v?`<div class="dl"><b>${t}</b><p>${esc(v)}</p></div>`:'';
  $('detail').innerHTML=`<h2>${esc(e.name)}</h2>
    <div style="margin-top:10px">${ratingHTML(e,26)}</div>
    <div class="meta">${meta.map(m=>`<div><small>${m[0]}</small>${esc(m[1])}</div>`).join('')}</div>
    ${tabSec}${sec('Gesamteindruck / Notizen',e.notes)}`;
  show('vDetail');
}
$('dBack').onclick=()=>{ show('vList'); };
$('dEdit').onclick=()=>openForm(detailId);
$('dDel').onclick=()=>{
  const e=entries.find(x=>x.id===detailId); if(!e) return;
  if(confirm(`„${e.name}“ wirklich löschen?`)){ entries=entries.filter(x=>x.id!==detailId); save(); renderList(); show('vList'); toast('Gelöscht'); }
};

/* ---------- Formular ---------- */
const FIELDS={name:'f_name',distillery:'f_dist',type:'f_type',abv:'f_abv',year:'f_year',age:'f_age',date:'f_date',place:'f_place',nose:'f_nose',taste:'f_taste',finish:'f_finish',notes:'f_notes'};
function openForm(id){
  const e = id ? entries.find(x=>x.id===id) : null;
  cur = e ? JSON.parse(JSON.stringify(e)) : {id:null,rating:0,bonus:false,date:today()};
  cur.rating=cur.rating||0;
  TABS.forEach(t=>{ if(!Array.isArray(cur[t.notes])) cur[t.notes]=[]; });
  for(const [k,el] of Object.entries(FIELDS)) $(el).value = cur[k]==null?'':cur[k];
  buildRegionSelect(cur.region||''); $('newRegionRow').hidden=true; $('f_newRegion').value='';
  $('fTitle').textContent = e?'Eintrag bearbeiten':'Neuer Eintrag';
  openG={nose:new Set(),taste:new Set(),finish:new Set()}; addOpen=null;
  buildStarPicker(); paintPicker(); renderAllNotes(); setTab('nose');
  show('vForm');
  if(!e) setTimeout(()=>$('f_name').focus(),50);
}
$('btnNew').onclick=()=>openForm(null);
$('fBack').onclick=()=>{ if(cur&&cur.id) show('vDetail'); else show('vList'); };
$('rateClear').onclick=()=>{ cur.rating=0; cur.bonus=false; paintPicker(); };
$('bonusBtn').onclick=()=>{ cur.bonus=!cur.bonus; paintPicker(); };
$('fSave').onclick=()=>{
  const name=$('f_name').value.trim();
  if(!name){ toast('Bitte einen Namen eingeben'); $('f_name').focus(); return; }
  const o={...cur};
  for(const [k,el] of Object.entries(FIELDS)) o[k]=$(el).value.trim();
  o.abv=o.abv.replace(',','.');
  let reg=$('f_region').value;
  if(reg==='__new__'){
    reg=$('f_newRegion').value.trim().replace(/\s+/g,' ');
    if(reg && !KNOWN_REGIONS.has(reg) && !S.regions.includes(reg)){ S.regions.push(reg); saveSettings(); }
  }
  o.region=reg;
  delete o.palate; delete o.flavors;
  if(o.id){ entries=entries.map(x=>x.id===o.id?{...o,updated:Date.now()}:x); }
  else { o.id=uid(); o.created=Date.now(); entries.push(o); }
  if(save()){ renderList(); toast('Gespeichert'); openDetail(o.id); }
};

/* ---------- Verwaltung: Noten & Regionen ---------- */
function renderManage(){
  const y=window.scrollY, map=noteMap(), all=[...map.values()];
  let h=`<div class="hint">Mitgelieferte Noten kannst du <b>ausblenden</b> – sie verschwinden dann aus der Auswahl, bleiben aber in bereits gespeicherten Einträgen. Eigene Noten kannst du in eine andere Gruppe <b>verschieben</b> oder <b>löschen</b> (dann werden sie aus allen Einträgen entfernt). Neue Noten legst du direkt im Formular mit „＋ Eigene“ in der jeweiligen Gruppe an.</div>`;
  if(S.hidden.length) h+=`<div style="margin-top:10px"><button data-showall="1">Alle ausgeblendeten wieder einblenden (${S.hidden.length})</button></div>`;
  GROUPS.forEach(g=>{
    h+=`<div class="mgroup"><b>${esc(g)}</b>`;
    all.filter(n=>n.group===g).forEach(n=>{
      h+=`<div class="mrow ${n.hidden?'dim':''}"><span class="mn">${n.emoji?esc(n.emoji)+' ':''}${esc(n.name)}</span>`;
      if(n.builtin){
        h+= n.hidden ? `<button data-show="${esc(n.name)}">Einblenden</button>` : `<button class="ghost" data-hide="${esc(n.name)}">Ausblenden</button>`;
      } else {
        h+=`<select data-move="${esc(n.name)}" aria-label="Gruppe">${GROUPS.map(x=>`<option ${x===g?'selected':''}>${esc(x)}</option>`).join('')}</select><button class="danger" data-del="${esc(n.name)}" aria-label="Löschen">✕</button>`;
      }
      h+='</div>';
    });
    h+='</div>';
  });
  h+=`<div class="mgroup"><b>Eigene Regionen</b>`;
  if(S.regions.length) S.regions.forEach(r=>{ h+=`<div class="mrow"><span class="mn">${esc(r)}</span><button class="danger" data-delreg="${esc(r)}" aria-label="Entfernen">✕</button></div>`; });
  else h+=`<div class="hint">Noch keine. Im Formular über „Region / Land → Eigene Region hinzufügen“ anlegen.</div>`;
  h+=`<div class="hint">Beim Entfernen bleibt die Region in bestehenden Einträgen erhalten und verschwindet nur aus der Auswahl.</div></div>`;
  $('manage').innerHTML=h; window.scrollTo(0,y);
}
$('manage').addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b) return;
  const d=b.dataset;
  if(d.hide!==undefined){ if(!S.hidden.includes(d.hide)) S.hidden.push(d.hide); saveSettings(); renderManage(); }
  else if(d.show!==undefined){ S.hidden=S.hidden.filter(x=>x!==d.show); saveSettings(); renderManage(); }
  else if(d.showall!==undefined){ S.hidden=[]; saveSettings(); renderManage(); }
  else if(d.del!==undefined){
    const name=d.del;
    const cnt=entries.filter(e=>TABS.some(t=>(e[t.notes]||[]).includes(name))).length;
    if(!confirm(`Eigene Note „${name}“ löschen?`+(cnt?`\nSie wird aus ${cnt} gespeicherten ${cnt===1?'Eintrag':'Einträgen'} entfernt.`:''))) return;
    S.custom=S.custom.filter(c=>c.name!==name);
    entries.forEach(e=>TABS.forEach(t=>{ e[t.notes]=(e[t.notes]||[]).filter(n=>n!==name); }));
    saveSettings(); save(); renderManage(); renderList(); toast('Gelöscht');
  }
  else if(d.delreg!==undefined){ S.regions=S.regions.filter(r=>r!==d.delreg); saveSettings(); renderManage(); }
});
$('manage').addEventListener('change',ev=>{
  const s=ev.target.closest('select[data-move]'); if(!s) return;
  const c=S.custom.find(x=>x.name===s.dataset.move); if(!c) return;
  c.group=s.value; saveSettings(); renderManage(); toast('Verschoben nach „'+s.value+'“');
});
$('mBack').onclick=()=>{ show('vList'); renderList(); };

/* ---------- Menü & Backup ---------- */
function openSheet(){ $('sheet').hidden=false; }
function closeSheet(){ $('sheet').hidden=true; }
$('btnMenu').onclick=openSheet;
$('mClose').onclick=closeSheet;
$('sheet').addEventListener('click',e=>{ if(e.target===$('sheet')) closeSheet(); });
$('mManage').onclick=()=>{ closeSheet(); renderManage(); show('vManage'); };
$('mExport').onclick=()=>{ closeSheet(); exportData(); };
$('mImport').onclick=()=>{ closeSheet(); $('importFile').click(); };

function exportData(){
  const blob=new Blob([JSON.stringify({app:'whisky-logbuch',version:2,exported:new Date().toISOString(),entries,settings:S},null,2)],{type:'application/json'});
  const name=`whisky-logbuch-${today()}.json`;
  try{
    const f=new File([blob],name,{type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[f]})){ navigator.share({files:[f],title:'Whisky-Logbuch Backup'}).catch(()=>{}); return; }
  }catch(e){}
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
$('importFile').addEventListener('change',ev=>{
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result); const arr=Array.isArray(d)?d:d.entries;
      if(!Array.isArray(arr)) throw 0;
      if(d && d.settings){
        (Array.isArray(d.settings.custom)?d.settings.custom:[]).forEach(c=>{
          if(c && typeof c.name==='string' && c.name && !noteMap().has(c.name)) S.custom.push({name:c.name,emoji:typeof c.emoji==='string'?c.emoji:'',group:GROUPS.includes(c.group)?c.group:'Sonstiges'});
        });
        (Array.isArray(d.settings.regions)?d.settings.regions:[]).forEach(x=>{ if(typeof x==='string' && x && !S.regions.includes(x) && !KNOWN_REGIONS.has(x)) S.regions.push(x); });
        saveSettings();
      }
      const have=new Set(entries.map(e=>e.id)); let n=0;
      arr.forEach(e=>{
        if(!e || typeof e!=='object' || !e.name) return;
        if(!e.id) e.id=uid();
        if(have.has(e.id)) return;
        normalizeEntry(e); entries.push(e); have.add(e.id); n++;
      });
      ensureNotesKnown(); save(); renderList(); toast(n+' Einträge importiert');
    }catch(e){ toast('Datei konnte nicht gelesen werden'); }
    ev.target.value='';
  };
  r.readAsText(f);
});

/* Zurück-Taste (Android) */
history.replaceState({v:1},'');
window.addEventListener('popstate',()=>{
  history.pushState({v:1},'');
  if(!$('sheet').hidden){ closeSheet(); return; }
  if(!$('vList').classList.contains('active')){ show('vList'); renderList(); }
});
history.pushState({v:1},'');

/* Offline / Installation */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

renderList();
})();
</script>
